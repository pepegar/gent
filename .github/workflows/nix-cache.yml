name: Nix Cache

on:
  push:
    branches:
      - main

concurrency:
  group: nix-cache-${{ github.ref }}-${{ matrix.os }}
  cancel-in-progress: true

jobs:
  populate:
    name: Populate ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - uses: cachix/cachix-action@v15
        with:
          name: gent
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community

      - name: Build gent package
        run: nix build .#gent

      - name: Materialise devShell
        run: nix develop --command true

      - name: Build checks
        run: nix flake check
