name: CI

on:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-action/setup@v1

      - name: Install Janet
        uses: janet-lang/setup-janet@v1

      - name: Build
        run: cargo build

      - name: Janet tests
        run: janet janet/test/run.janet

      - name: Rust tests
        run: cargo test
