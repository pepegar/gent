name: CI

on:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Janet
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update && sudo apt-get install -y libssl-dev
            git clone --depth 1 --branch v1.37.1 https://github.com/janet-lang/janet.git /tmp/janet
            cd /tmp/janet && make -j$(nproc) && sudo make install
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install janet
          fi

      - name: Build
        run: cargo build

      - name: Janet tests
        run: janet janet/test/run.janet

      - name: Rust tests
        run: cargo test

      - name: Installer smoke tests
        run: bash test/install.sh

      - name: Cache tui-wright binary
        uses: actions/cache@v4
        id: cache-tui-wright
        with:
          path: ~/.cargo/bin/tui-wright
          key: tui-wright-${{ runner.os }}-f565303f

      - name: Install tui-wright
        if: steps.cache-tui-wright.outputs.cache-hit != 'true'
        run: cargo install --git https://github.com/pepegar/tui-wright --rev f565303f0af6115a403f9b600a97f50cc59ef3dd

      - name: Integration tests (tui-wright)
        env:
          FRAME_TIME_LIMIT: "100"
        run: |
          bash test/tui-wright-focus.sh
          bash test/tui-wright-model.sh
          bash test/tui-wright-profile.sh
